server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # key set endpoint — served from the generated key material.
    location = /protocol/openid-connect/certs {
        alias /srv/generated/certs;
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Cache-Control "no-store" always;
    }

    # status page + everything else static
    location / {
        try_files $uri $uri/ /index.html;
    }
}
